---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: demo
data:
  settings.json: |
    {
      "logLevel": "info"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo}
  template:
    spec:
      containers:
        - name: web
          image: example/web:1.4
          args: ["--port", "8080"]
          env:
            - name: MODE
              value: "production"
