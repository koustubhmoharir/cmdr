name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet: ['10.0.x']
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          dotnet build -nologo -v:q
          dotnet test --no-build
        shell: bash
      - name: Note
        run: echo "done" # trailing comment
