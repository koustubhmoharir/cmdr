[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-project"
version = "1.2.0"
description = "Sample for the TOML round trip tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sam Example", email = "sam@example.com" },  # first author
]
dependencies = [
    "httpx>=0.27",
    'tomli>=2.0; python_version < "3.11"',
]
keywords = ["config", "toml"]
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
sample = "sample_project.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]

[[tool.mypy.overrides]]
module = ["legacy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["generated.*"]
ignore_errors = true
